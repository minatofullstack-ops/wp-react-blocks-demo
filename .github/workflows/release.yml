name: Release

# Push a tag such as v1.0.0 to build the theme and plugin and attach the ZIPs
# to a GitHub Release. The Playground blueprint installs these ZIPs.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lumen-blocks.zip
            dist/lumen.zip
          generate_release_notes: true

      # GitHub release downloads redirect without CORS headers, so the
      # browser-based WordPress Playground cannot fetch them. Publish the
      # same ZIPs to the dist branch, served from raw.githubusercontent.com.
      - name: Publish ZIPs to the dist branch for Playground
        run: |
          mkdir /tmp/dist-branch
          cp dist/lumen-blocks.zip dist/lumen.zip /tmp/dist-branch/
          # Japanese core translations for the latest WordPress, so the
          # Playground admin can be shown in Japanese without fetching from
          # wordpress.org in the browser (which is blocked by CORS).
          JA_URL=$(curl -fsSL https://api.wordpress.org/translations/core/1.0/ | jq -r '.translations[] | select(.language=="ja") | .package')
          curl -fsSLo /tmp/dist-branch/wp-ja.zip "$JA_URL"
          cd /tmp/dist-branch
          git init -b dist
          git config user.name "minatofullstack-ops"
          git config user.email "296015733+minatofullstack-ops@users.noreply.github.com"
          git add .
          git commit -m "Build ZIPs for ${GITHUB_REF_NAME}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dist
