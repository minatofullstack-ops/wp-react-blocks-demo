name: Release

# Push a tag such as v1.0.0 to build the theme and plugin and attach the ZIPs
# to a GitHub Release. The Playground blueprint installs these ZIPs.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lumen-blocks.zip
            dist/lumen.zip
          generate_release_notes: true
