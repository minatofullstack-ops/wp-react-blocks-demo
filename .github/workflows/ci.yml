name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, test & build (JS/CSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm test
      - run: npm run build
      - run: npm run zip

      - uses: actions/upload-artifact@v4
        with:
          name: zips
          path: dist/*.zip
          retention-days: 7

  php:
    name: PHP (WordPress Coding Standards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --no-progress
      - name: Syntax check
        run: find plugins themes -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
      - name: PHPCS
        run: vendor/bin/phpcs
